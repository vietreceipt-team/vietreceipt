openapi: 3.1.0
info:
  title: VietReceipt API
  version: 1.3.0-draft
  description: API Contract v1 for the VietReceipt core workflow.
servers:
  - url: http://localhost:8000/api/v1
    description: Local development
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: User registration and access tokens.
  - name: Receipts
    description: Receipt upload, processing, retrieval and deletion.
  - name: Verification
    description: Human review, correction and verification.
  - name: Reporting
    description: Dashboard summaries and verified-data export.

paths:
  /auth/register:
    post:
      summary: Register a user
      tags: [Auth]
      security: []
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      summary: Log in
      tags: [Auth]
      security: []
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Access token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /receipts:
    post:
      summary: Upload a receipt image
      tags: [Receipts]
      operationId: uploadReceipt
      description: Stores one image and creates a receipt in UPLOADED state. Processing is started separately.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG or WebP; maximum 10 MiB.
      responses:
        '201':
          description: Receipt uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          description: Upload exceeds 10 MiB
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported or invalid image content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      summary: List receipts
      tags: [Receipts]
      operationId: listReceipts
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/ReceiptStatus'
        - name: merchant_name
          in: query
          schema:
            type: string
        - name: date_from
          in: query
          schema:
            type: string
            format: date
        - name: date_to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Paginated receipt list owned by the current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptPage'

  /receipts/{receipt_id}:
    parameters:
      - $ref: '#/components/parameters/ReceiptId'
    get:
      summary: Get receipt details
      tags: [Receipts]
      operationId: getReceipt
      responses:
        '200':
          description: Receipt details including OCR blocks and extracted fields when available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDetail'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      summary: Delete a receipt
      tags: [Receipts]
      operationId: deleteReceipt
      responses:
        '204':
          description: Receipt data deleted; object cleanup completed or scheduled
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /receipts/{receipt_id}/image:
    parameters:
      - $ref: '#/components/parameters/ReceiptId'
    get:
      summary: Get a receipt image
      tags: [Receipts]
      operationId: getReceiptImage
      description: Returns an authorized redirect/stream for the private image.
      responses:
        '200':
          description: Image bytes
          content:
            image/jpeg: {}
            image/png: {}
            image/webp: {}
        '404':
          $ref: '#/components/responses/NotFound'

  /receipts/{receipt_id}/process:
    parameters:
      - $ref: '#/components/parameters/ReceiptId'
    post:
      summary: Start receipt processing
      tags: [Receipts]
      operationId: processReceipt
      description: Valid for UPLOADED. Also valid for NEEDS_REVIEW only when reprocess=true.
      parameters:
        - name: reprocess
          in: query
          required: false
          schema:
            type: boolean
            default: false
      responses:
        '202':
          description: Processing job accepted and receipt is QUEUED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          description: Queue is unavailable; receipt remains in its previous state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /receipts/{receipt_id}/retry:
    parameters:
      - $ref: '#/components/parameters/ReceiptId'
    post:
      summary: Retry failed processing
      tags: [Receipts]
      operationId: retryReceipt
      description: Valid only for FAILED receipts with a retryable error.
      responses:
        '202':
          description: Retry accepted and receipt is QUEUED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProcessAccepted'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /receipts/{receipt_id}/ocr:
    parameters:
      - $ref: '#/components/parameters/ReceiptId'
    get:
      summary: Get normalized OCR output
      tags: [Receipts]
      operationId: getReceiptOcr
      parameters:
        - name: ocr_run_id
          in: query
          required: false
          description: Specific immutable OCR run; omit for the latest successful run.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Normalized OCR result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OCRResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /receipts/{receipt_id}/fields:
    parameters:
      - $ref: '#/components/parameters/ReceiptId'
    get:
      summary: Get extracted fields
      tags: [Verification]
      operationId: getReceiptFields
      parameters:
        - name: kie_run_id
          in: query
          required: false
          description: Specific immutable KIE run; omit for the latest successful run.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Exactly five extracted fields
          content:
            application/json:
              schema:
                type: array
                minItems: 5
                maxItems: 5
                items:
                  $ref: '#/components/schemas/ExtractedField'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /fields/{field_id}:
    parameters:
      - name: field_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      summary: Correct an extracted field
      tags: [Verification]
      operationId: correctField
      description: Valid only while the parent receipt is NEEDS_REVIEW.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FieldCorrectionRequest'
      responses:
        '200':
          description: Updated field and correction history entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractedField'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /fields/{field_id}/correction:
    parameters:
      - name: field_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    delete:
      summary: Clear a field correction
      tags: [Verification]
      operationId: clearFieldCorrection
      description: Removes the human correction and falls back to the immutable KIE normalized value/status.
      responses:
        '200':
          description: Field with machine value/status restored as effective output
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractedField'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /receipts/{receipt_id}/verify:
    parameters:
      - $ref: '#/components/parameters/ReceiptId'
    post:
      summary: Verify a receipt
      tags: [Verification]
      operationId: verifyReceipt
      description: Valid only for NEEDS_REVIEW after all five effective statuses are resolved and effective values match their status/type.
      responses:
        '200':
          description: Receipt is VERIFIED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'

  /receipts/{receipt_id}/history:
    parameters:
      - $ref: '#/components/parameters/ReceiptId'
    get:
      summary: Get correction history
      tags: [Verification]
      operationId: getReceiptHistory
      responses:
        '200':
          description: Correction history ordered oldest to newest
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CorrectionHistory'
        '404':
          $ref: '#/components/responses/NotFound'

  /dashboard/summary:
    get:
      summary: Get dashboard summary
      tags: [Reporting]
      operationId: getDashboardSummary
      responses:
        '200':
          description: Current user's summary. Spending uses verified receipts only.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardSummary'

  /receipts/export:
    get:
      summary: Export receipt data
      tags: [Reporting]
      operationId: exportReceipts
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, xlsx, json]
            default: csv
        - name: include_unverified
          in: query
          required: false
          description: Reserved for authorized diagnostic use; false by default.
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Export file
          content:
            text/csv: {}
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: {}
            application/json: {}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ReceiptId:
      name: receipt_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found or not owned by the current user
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Resource or state conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Request or field validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ReceiptStatus:
      type: string
      enum: [UPLOADED, QUEUED, PROCESSING, NEEDS_REVIEW, VERIFIED, FAILED]
    ProcessingStage:
      type: [string, 'null']
      enum: [PREPROCESSING, OCR, KIE, PERSISTING, null]
    FieldType:
      type: string
      enum: [merchant_name, receipt_date, total_amount, invoice_id, merchant_address]
    ValueStatus:
      type: string
      enum: [PRESENT, NOT_PRESENT, UNREADABLE, AMBIGUOUS, UNKNOWN]
    NullableValueStatus:
      oneOf:
        - {$ref: '#/components/schemas/ValueStatus'}
        - {type: 'null'}
    ReviewReason:
      type: string
      enum: [LOW_CONFIDENCE, NOT_PRESENT, UNREADABLE, AMBIGUOUS, UNKNOWN, NORMALIZATION_FAILED, FORMAT_INVALID]
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 128}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
    User:
      type: object
      additionalProperties: false
      required: [user_id, email, created_at]
      properties:
        user_id: {type: string, format: uuid}
        email: {type: string, format: email}
        created_at: {type: string, format: date-time}
    TokenResponse:
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in]
      properties:
        access_token: {type: string}
        token_type: {const: bearer}
        expires_in: {type: integer, minimum: 1, description: Seconds}
    ReceiptSummary:
      type: object
      additionalProperties: false
      required: [receipt_id, original_filename, status, created_at]
      properties:
        receipt_id: {type: string, format: uuid}
        original_filename: {type: string}
        status: {$ref: '#/components/schemas/ReceiptStatus'}
        merchant_name: {type: [string, 'null']}
        receipt_date: {type: [string, 'null'], format: date}
        total_amount: {type: [integer, 'null'], minimum: 0}
        created_at: {type: string, format: date-time}
        verified_at: {type: [string, 'null'], format: date-time}
    ReceiptPage:
      type: object
      additionalProperties: false
      required: [items, page, page_size, total_items, total_pages]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/ReceiptSummary'}
        page: {type: integer, minimum: 1}
        page_size: {type: integer, minimum: 1}
        total_items: {type: integer, minimum: 0}
        total_pages: {type: integer, minimum: 0}
    ReceiptDetail:
      type: object
      additionalProperties: false
      required:
        - receipt_id
        - original_filename
        - status
        - processing_stage
        - image_width_px
        - image_height_px
        - fields
        - ocr_blocks
        - created_at
      properties:
        receipt_id: {type: string, format: uuid}
        original_filename: {type: string}
        status: {$ref: '#/components/schemas/ReceiptStatus'}
        processing_stage: {$ref: '#/components/schemas/ProcessingStage'}
        image_url: {type: string, format: uri, description: Authorized API URL or short-lived URL}
        image_width_px: {type: integer, minimum: 1}
        image_height_px: {type: integer, minimum: 1}
        latest_ocr_run_id: {type: [string, 'null'], format: uuid}
        latest_kie_run_id: {type: [string, 'null'], format: uuid}
        fields:
          type: array
          minItems: 0
          maxItems: 5
          items: {$ref: '#/components/schemas/ExtractedField'}
        ocr_blocks:
          type: array
          items: {$ref: '#/components/schemas/OCRBlock'}
        last_error:
          oneOf:
            - {$ref: '#/components/schemas/ProcessingError'}
            - {type: 'null'}
        created_at: {type: string, format: date-time}
        processed_at: {type: [string, 'null'], format: date-time}
        verified_at: {type: [string, 'null'], format: date-time}
    ProcessAccepted:
      type: object
      additionalProperties: false
      required: [receipt_id, status]
      properties:
        receipt_id: {type: string, format: uuid}
        status: {const: QUEUED}
    Point:
      type: object
      additionalProperties: false
      required: [x, y]
      properties:
        x: {type: number, minimum: 0, maximum: 1}
        y: {type: number, minimum: 0, maximum: 1}
    OCRBlock:
      type: object
      additionalProperties: false
      required: [block_id, text, confidence, polygon, reading_order]
      properties:
        block_id: {type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]*$'}
        text: {type: string, minLength: 1}
        confidence: {type: number, minimum: 0, maximum: 1}
        polygon:
          type: array
          minItems: 4
          maxItems: 4
          items: {$ref: '#/components/schemas/Point'}
        reading_order: {type: integer, minimum: 0}
    ComponentVersion:
      type: object
      additionalProperties: false
      required: [name, version]
      properties:
        name: {type: string, minLength: 1}
        version: {type: string, minLength: 1}
    OCRResult:
      type: object
      additionalProperties: false
      required: [schema_version, receipt_id, ocr_run_id, engine, image, blocks, average_confidence, duration_ms]
      properties:
        schema_version: {const: '1.3'}
        receipt_id: {type: string, format: uuid}
        ocr_run_id: {type: string, format: uuid}
        engine: {$ref: '#/components/schemas/ComponentVersion'}
        image:
          type: object
          additionalProperties: false
          required: [width_px, height_px]
          properties:
            width_px: {type: integer, minimum: 1}
            height_px: {type: integer, minimum: 1}
        blocks:
          type: array
          items: {$ref: '#/components/schemas/OCRBlock'}
        average_confidence: {type: number, minimum: 0, maximum: 1}
        duration_ms: {type: integer, minimum: 0}
    FieldValue:
      oneOf:
        - {type: string}
        - {type: integer, minimum: 0}
        - {type: 'null'}
    PredictedValue:
      type: [string, 'null']
    ExtractedField:
      type: object
      additionalProperties: false
      required:
        - field_id
        - field_type
        - ocr_run_id
        - kie_run_id
        - raw_text
        - predicted_value
        - normalized_value
        - value_status
        - corrected_value
        - corrected_status
        - has_correction
        - effective_value
        - effective_status
        - confidence
        - machine_needs_review
        - effective_needs_review
        - review_reasons
        - source_block_ids
        - verified
        - updated_at
      properties:
        field_id: {type: string, format: uuid}
        field_type: {$ref: '#/components/schemas/FieldType'}
        ocr_run_id: {type: string, format: uuid}
        kie_run_id: {type: string, format: uuid}
        raw_text: {type: [string, 'null']}
        predicted_value: {$ref: '#/components/schemas/PredictedValue'}
        normalized_value: {$ref: '#/components/schemas/FieldValue'}
        value_status: {$ref: '#/components/schemas/ValueStatus'}
        corrected_value: {$ref: '#/components/schemas/FieldValue'}
        corrected_status: {$ref: '#/components/schemas/NullableValueStatus'}
        has_correction:
          type: boolean
          description: Distinguishes no correction from an explicit null correction such as NOT_PRESENT.
        effective_value:
          $ref: '#/components/schemas/FieldValue'
          description: corrected_value when has_correction=true, otherwise normalized_value. Never falls back to predicted_value.
        effective_status:
          $ref: '#/components/schemas/ValueStatus'
          description: corrected_status when has_correction=true, otherwise value_status.
        confidence: {type: number, minimum: 0, maximum: 1}
        machine_needs_review:
          type: boolean
          description: Immutable review signal produced by the KIE run.
        effective_needs_review:
          type: boolean
          description: Current Backend-derived review state after correction and verification; Frontend uses this flag for warnings.
        review_reasons:
          type: array
          uniqueItems: true
          items: {$ref: '#/components/schemas/ReviewReason'}
        source_block_ids:
          type: array
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 64}
        verified: {type: boolean}
        updated_at: {type: string, format: date-time}
    FieldCorrectionRequest:
      type: object
      additionalProperties: false
      required: [value, value_status, expected_updated_at]
      properties:
        value:
          $ref: '#/components/schemas/FieldValue'
          description: Non-null and correctly typed for PRESENT; null for every other status. Null does not clear a correction.
        value_status:
          $ref: '#/components/schemas/ValueStatus'
        expected_updated_at:
          type: string
          format: date-time
          description: Optimistic concurrency token from the latest field response.
      allOf:
        - if:
            properties:
              value_status: {const: PRESENT}
          then:
            properties:
              value:
                oneOf:
                  - {type: string, minLength: 1}
                  - {type: integer, minimum: 0}
          else:
            properties:
              value: {type: 'null'}
    CorrectionHistory:
      type: object
      additionalProperties: false
      required: [correction_id, field_id, field_type, kie_run_id, old_value, new_value, old_status, new_status, changed_by, changed_at]
      properties:
        correction_id: {type: string, format: uuid}
        field_id: {type: string, format: uuid}
        field_type: {$ref: '#/components/schemas/FieldType'}
        kie_run_id: {type: string, format: uuid}
        old_value: {$ref: '#/components/schemas/FieldValue'}
        new_value: {$ref: '#/components/schemas/FieldValue'}
        old_status: {$ref: '#/components/schemas/NullableValueStatus'}
        new_status: {$ref: '#/components/schemas/NullableValueStatus'}
        changed_by: {type: string, format: uuid}
        changed_at: {type: string, format: date-time}
    ProcessingError:
      type: object
      additionalProperties: false
      required: [stage, code, message, retryable, occurred_at]
      properties:
        stage:
          type: string
          enum: [PREPROCESSING, OCR, KIE, PERSISTING]
        code: {type: string}
        message: {type: string}
        retryable: {type: boolean}
        occurred_at: {type: string, format: date-time}
    DashboardSummary:
      type: object
      additionalProperties: false
      required: [total_receipts, processing, needs_review, verified, failed, total_spending_vnd, average_ocr_confidence, correction_rate]
      properties:
        total_receipts: {type: integer, minimum: 0}
        processing: {type: integer, minimum: 0}
        needs_review: {type: integer, minimum: 0}
        verified: {type: integer, minimum: 0}
        failed: {type: integer, minimum: 0}
        total_spending_vnd: {type: integer, minimum: 0}
        average_ocr_confidence: {type: number, minimum: 0, maximum: 1}
        correction_rate: {type: number, minimum: 0, maximum: 1}
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            details: {type: object, additionalProperties: true}
            request_id: {type: string, format: uuid}
