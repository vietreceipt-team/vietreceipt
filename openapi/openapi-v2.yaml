components:
  schemas:
    Body_upload_api_v2_receipts_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
        source_group:
          anyOf:
          - type: string
            enum:
            - PAPER_DIGITIZED
            - IMAGE
            - PDF
          - type: 'null'
          title: Source Group
      type: object
      required:
      - file
      title: Body_upload_api_v2_receipts_post
    CorrectionRequest:
      properties:
        expected_version:
          type: integer
          minimum: 1.0
          title: Expected Version
        value:
          anyOf:
          - type: string
          - type: integer
          - type: number
          - type: 'null'
          title: Value
        status:
          type: string
          enum:
          - PRESENT
          - NOT_PRESENT
          - UNREADABLE
          - AMBIGUOUS
          - UNKNOWN
          title: Status
      additionalProperties: false
      type: object
      required:
      - expected_version
      - value
      - status
      title: CorrectionRequest
    ErrorBody:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        request_id:
          type: string
          title: Request Id
      type: object
      required:
      - code
      - message
      - request_id
      title: ErrorBody
    ErrorResponse:
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'
      type: object
      required:
      - error
      title: ErrorResponse
    FieldView:
      properties:
        raw_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Raw Text
        normalized_value:
          anyOf:
          - type: string
          - type: integer
          - type: number
          - type: 'null'
          title: Normalized Value
        value_status:
          type: string
          enum:
          - PRESENT
          - NOT_PRESENT
          - UNREADABLE
          - AMBIGUOUS
          - UNKNOWN
          title: Value Status
        source_block_ids:
          items:
            type: string
          type: array
          title: Source Block Ids
        corrected_value:
          anyOf:
          - type: string
          - type: integer
          - type: number
          - type: 'null'
          title: Corrected Value
        corrected_status:
          anyOf:
          - type: string
          - type: 'null'
          title: Corrected Status
        has_correction:
          type: boolean
          title: Has Correction
        effective_value:
          anyOf:
          - type: string
          - type: integer
          - type: number
          - type: 'null'
          title: Effective Value
        effective_status:
          type: string
          title: Effective Status
        reviewed:
          type: boolean
          title: Reviewed
        effective_needs_review:
          type: boolean
          title: Effective Needs Review
        confidence:
          anyOf:
          - type: number
          - type: 'null'
          title: Confidence
        machine_needs_review:
          type: boolean
          title: Machine Needs Review
          default: true
        review_reasons:
          items:
            type: string
          type: array
          title: Review Reasons
          default: []
      additionalProperties: true
      type: object
      required:
      - raw_text
      - normalized_value
      - value_status
      - source_block_ids
      - corrected_value
      - corrected_status
      - has_correction
      - effective_value
      - effective_status
      - reviewed
      - effective_needs_review
      title: FieldView
    InvoiceDetail:
      properties:
        receipt_id:
          type: string
          title: Receipt Id
        original_filename:
          type: string
          title: Original Filename
        content_type:
          type: string
          title: Content Type
        source_group:
          type: string
          enum:
          - PAPER_DIGITIZED
          - IMAGE
          - PDF
          title: Source Group
        status:
          type: string
          enum:
          - UPLOADED
          - PROCESSING
          - NEEDS_REVIEW
          - VERIFIED
          - FAILED
          title: Status
        version:
          type: integer
          title: Version
        created_at:
          type: string
          title: Created At
        updated_at:
          type: string
          title: Updated At
        verified_at:
          anyOf:
          - type: string
          - type: 'null'
          title: Verified At
        source_url:
          type: string
          title: Source Url
        evidence_url:
          type: string
          title: Evidence Url
        latest_ocr_run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Ocr Run Id
        latest_kie_run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Latest Kie Run Id
        processing_stage:
          anyOf:
          - type: string
          - type: 'null'
          title: Processing Stage
        processing_error:
          anyOf:
          - $ref: '#/components/schemas/ProcessingErrorView'
          - type: 'null'
        fields:
          additionalProperties:
            $ref: '#/components/schemas/FieldView'
          propertyNames:
            enum:
            - invoice_template_number
            - invoice_symbol
            - invoice_number
            - invoice_date
            - seller_name
            - seller_tax_id
            - seller_address
            - buyer_name
            - buyer_tax_id
            - subtotal
            - tax_amount
            - total_amount
            - currency
          type: object
          title: Fields
        line_items:
          items:
            $ref: '#/components/schemas/LineView'
          type: array
          title: Line Items
        tax_breakdown:
          items:
            $ref: '#/components/schemas/TaxView'
          type: array
          title: Tax Breakdown
      type: object
      required:
      - receipt_id
      - original_filename
      - content_type
      - source_group
      - status
      - version
      - created_at
      - updated_at
      - verified_at
      - source_url
      - evidence_url
      - latest_ocr_run_id
      - latest_kie_run_id
      - processing_stage
      - processing_error
      - fields
      - line_items
      - tax_breakdown
      title: InvoiceDetail
    InvoicePage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/Summary'
          type: array
          title: Items
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
