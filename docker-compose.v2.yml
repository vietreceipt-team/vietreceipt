# Standalone TV5 stack: docker compose -f docker-compose.v2.yml up --build
name: vietreceipt-v2
x-runtime: &runtime
  build:
    context: .
    dockerfile: infra/docker/backend-v2.Dockerfile
  environment: &environment
    DATABASE_URL: postgresql+psycopg://vietreceipt:local_dev_only@postgres:5432/vietreceipt
    CELERY_BROKER_URL: redis://redis:6379/0
    STORAGE_BACKEND: filesystem
    STORAGE_FILESYSTEM_ROOT: /data/sources
    V2_DOCUMENT_READER_CALLABLE: ${V2_DOCUMENT_READER_CALLABLE:-}
    V2_KIE_CALLABLE: ${V2_KIE_CALLABLE:-}
  volumes:
    - source_data:/data/sources
  depends_on:
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vietreceipt
      POSTGRES_USER: vietreceipt
      POSTGRES_PASSWORD: local_dev_only
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U vietreceipt -d vietreceipt']
      interval: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      retries: 15
  migrate:
    build:
      context: .
      dockerfile: infra/docker/backend-v2.Dockerfile
    environment: *environment
    command: [python, -m, alembic, -c, backend/alembic.ini, upgrade, head]
    depends_on:
      postgres:
        condition: service_healthy
  backend:
    <<: *runtime
    ports: ['${BACKEND_V2_PORT:-8000}:8000']
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/api/v2/readiness")']
      interval: 10s
      retries: 12
  worker:
    <<: *runtime
    command: [python, -m, celery, -A, backend.app.v2.worker:celery_app, worker, --loglevel=info, --concurrency=2]
  beat:
    <<: *runtime
    command: [python, -m, celery, -A, backend.app.v2.worker:celery_app, beat, --loglevel=info, --schedule=/tmp/celerybeat-schedule]
volumes:
  db_data:
  redis_data:
  source_data:
