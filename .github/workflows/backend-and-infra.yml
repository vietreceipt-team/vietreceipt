name: Backend storage and local infrastructure

on:
  pull_request:
    paths:
      - ".env.example"
      - ".dockerignore"
      - ".gitignore"
      - "docker-compose.yml"
      - "backend/**"
      - "infra/**"
      - "docs/test-plan-v1.md"
      - "docs/implementation-notes.md"
      - "tests/contracts/**"
      - "requirements-contracts.txt"
      - ".github/workflows/backend-and-infra.yml"
  push:
    branches: [main]
    paths:
      - ".env.example"
      - ".dockerignore"
      - ".gitignore"
      - "docker-compose.yml"
      - "backend/**"
      - "infra/**"
      - "docs/test-plan-v1.md"
      - "docs/implementation-notes.md"
      - "tests/contracts/**"
      - "requirements-contracts.txt"
      - ".github/workflows/backend-and-infra.yml"

permissions:
  contents: read

jobs:
  backend-storage-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install Backend with test dependencies
        run: python -m pip install -e "./backend[test]"

      - name: Run Backend storage tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: python -m pytest backend/tests

  infrastructure-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-contracts.txt

      - name: Install pinned contract dependencies
        run: |
          python -m pip install -r requirements-contracts.txt
          python -m pip install -e "./backend[test]"

      - name: Create local-only environment
        run: cp .env.example .env

      - name: Run infrastructure smoke test
        run: ./infra/scripts/smoke-test.sh

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Remove containers and CI volumes
        if: always()
        run: docker compose down -v --remove-orphans
