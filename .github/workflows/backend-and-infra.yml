name: Backend storage and local infrastructure

on:
  pull_request:
    paths:
      - ".env.example"
      - ".dockerignore"
      - ".gitignore"
      - "docker-compose.yml"
      - "backend/**"
      - "infra/**"
      - "docs/test-plan-v1.md"
      - "docs/implementation-notes.md"
      - "tests/contracts/**"
      - "requirements-contracts.txt"
      - ".github/workflows/backend-and-infra.yml"
  push:
    branches: [main]
    paths:
      - ".env.example"
      - ".dockerignore"
      - ".gitignore"
      - "docker-compose.yml"
      - "backend/**"
      - "infra/**"
      - "docs/test-plan-v1.md"
      - "docs/implementation-notes.md"
      - "requirements-contracts.txt"
      - ".github/workflows/backend-and-infra.yml"

permissions:
  contents: read

jobs:
  backend-storage-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vietreceipt
          POSTGRES_PASSWORD: vietreceipt
          POSTGRES_DB: vietreceipt_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vietreceipt -d vietreceipt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/pyproject.toml
            backend/requirements-dev.txt

      - name: Install Backend with test dependencies
        run: python -m pip install -e "./backend[test]" -r backend/requirements-dev.txt

      - name: Run Alembic upgrade smoke
        env:
          DATABASE_URL: postgresql+psycopg://vietreceipt:vietreceipt@localhost:5432/vietreceipt_test
          PYTHONPATH: ${{ github.workspace }}
        working-directory: backend
        run: alembic upgrade head

      - name: Run Backend storage and PostgreSQL tests
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          TEST_DATABASE_URL: postgresql+psycopg://vietreceipt:vietreceipt@localhost:5432/vietreceipt_test
        run: python -m pytest backend/tests

  infrastructure-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-contracts.txt

      - name: Install pinned contract dependencies
        run: |
          python -m pip install -r requirements-contracts.txt
          python -m pip install -e "./backend[test]" -r backend/requirements-dev.txt

      - name: Create local-only environment
        run: cp .env.example .env

      - name: Run infrastructure smoke test
        run: ./infra/scripts/smoke-test.sh

      - name: Show container logs after failure
        if: failure()
        run: docker compose logs --no-color

      - name: Remove containers and CI volumes
        if: always()
        run: docker compose down -v --remove-orphans
