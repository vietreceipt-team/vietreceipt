name: Contract tests

on:
  pull_request:
    paths:
      - "schemas/**"
      - "examples/**"
      - "openapi/**"
      - "docs/receipt-state-machine.md"
      - "docs/integration-contracts.md"
      - "scripts/validate_annotation_ocr.py"
      - "tests/contracts/**"
      - "requirements-contracts.txt"
      - ".github/workflows/contract-tests.yml"
  push:
    branches: [main]
    paths:
      - "schemas/**"
      - "examples/**"
      - "openapi/**"
      - "docs/receipt-state-machine.md"
      - "docs/integration-contracts.md"
      - "scripts/validate_annotation_ocr.py"
      - "tests/contracts/**"
      - "requirements-contracts.txt"
      - ".github/workflows/contract-tests.yml"

permissions:
  contents: read

jobs:
  validate-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-contracts.txt

      - name: Install pinned contract dependency
        run: python -m pip install -r requirements-contracts.txt

      - name: Run contract tests
        run: python tests/contracts/run_contract_tests.py
