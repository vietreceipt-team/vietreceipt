name: Frontend V2

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-v2.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-v2.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Luu anh kiem chung Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-v2-playwright
          path: frontend/test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
