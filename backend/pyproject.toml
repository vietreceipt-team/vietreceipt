[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vietreceipt-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34,<2",
    "Pillow>=10.3,<13",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.1,<4",
    "alembic>=1.13,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["migrations*"]
